# Piper voice catalogue for HITT playback videos.
#
# Keys (e.g. northern_english_male) are used in meta.yaml under voices: [...]
# and by scripts/download-playback-voice.sh.
#
# Download models:
#   ./scripts/download-playback-voice.sh --list
#   ./scripts/download-playback-voice.sh alan
#   npm run playback:voice -- northern_english_male alan
#
# Samples: https://rhasspy.github.io/piper-samples/
#
# Optional VITS tuning (overrides playback-cli defaults when set):
#   lengthScale  — speaking rate (lower = faster). Default ~1.0
#   noiseScale   — expressiveness (higher = less monotone). Default ~0.1
#   noiseW       — rhythm variation. Default ~0.6
#
# Tune by ear: render one tape, adjust slightly, re-render.

voices:
  # Default for pilot tapes — slightly warmer than stock piper settings.
  northern_english_male:
    gender: male
    locale: en-GB
    model: en_GB-northern_english_male-medium
    quality: medium
    url: en/en_GB/northern_english_male/medium
    lengthScale: 0.95
    noiseScale: 0.25
    noiseW: 0.55

  # Often sounds more natural than northern_english_male — good A/B alternative.
  alan:
    gender: male
    locale: en-GB
    model: en_GB-alan-medium
    quality: medium
    url: en/en_GB/alan/medium
    lengthScale: 0.88
    noiseScale: 0.22
    noiseW: 0.55

  alba:
    gender: female
    locale: en-GB
    model: en_GB-alba-medium
    quality: medium
    url: en/en_GB/alba/medium
    lengthScale: 0.95
    noiseScale: 0.22
    noiseW: 0.55

  # Liverpool ARU corpus — Received Pronunciation (speaker 4). Same model file as other aru_* keys.
  aru_09:
    gender: female
    locale: en-GB
    model: en_GB-aru-medium
    quality: medium
    speaker: 4
    url: en/en_GB/aru/medium
    lengthScale: 1.0
    noiseScale: 0.2
    noiseW: 0.55

  # Low-quality model only — use for testing, not production narrations.
  southern_english_female:
    gender: female
    locale: en-GB
    model: en_GB-southern_english_female-low
    quality: low
    url: en/en_GB/southern_english_female/low
