apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chisel-ingress
  namespace: <NAMESPACE>
  annotations:
    # Increase timeouts so long-lived TCP sessions over WebSocket don't drop (Default is 60s)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Optional: Increase body size if transferring large payloads
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  # Enable TLS block if your Ingress handles internal TLS termination,
  # or rely on the external HTTPS Load Balancer doing TLS termination.
  #tls:
  #  - hosts:
  #      - <CHISEL-ALIAS>
  #    secretName: chisel-tls-cert  # Optional: omit if TLS is terminated higher up
  rules:
    - host: <CHISEL-ALIAS>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chisel-server
                port:
                  number: 8080
