title: Cluster resource summary
output: info-cluster-status
steps:
  - action: type
    command: cp -f docs/videos/demo/sample-hitt.conf docs/videos/demo/hitt.conf && chmod +x docs/videos/demo/hitt.sh
    narration: >
      HITT info cluster shows Kubernetes version and node CPU, memory, and
      pod summary. This demo uses mocks — no live cluster required.
    pause: 0.5

  - action: run
    pause: 0.5

  - action: type
    command: bash docs/videos/demo/hitt.sh -m 'info cluster'
    narration: Run info cluster to display the node summary.
    pause: 1

  - action: run
    pause: 0.5
