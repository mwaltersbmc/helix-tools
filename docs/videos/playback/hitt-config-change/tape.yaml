title: Change HITT configuration
output: hitt-config-change
steps:
  - action: type
    command: cp -f docs/videos/demo/sample-hitt.conf docs/videos/demo/hitt.conf && chmod +x docs/videos/demo/hitt.sh
    narration: >
      HITT settings live in hitt.conf. Edit the file, or delete it and
      re-run HITT to use the setup wizard again.
    pause: 0.5

  - action: run
    pause: 0.5

  - action: type
    command: cat docs/videos/demo/hitt.conf
    narration: Option one — review or edit hitt.conf in your editor.
    pause: 1

  - action: run
    pause: 0.5

  - action: type
    command: rm -f docs/videos/demo/hitt.conf && bash docs/videos/demo/hitt.sh -m post-hp
    narration: Option two — delete hitt.conf and run post-hp to reconfigure.
    pause: 1

  - action: run
    pause: 0.5
