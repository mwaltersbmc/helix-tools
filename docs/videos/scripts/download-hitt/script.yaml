id: download-hitt
title: Download the HITT script
locale: en-GB
voice: azure_ryan_chat

vhs:
  shell: bash

steps:
  - narration: >
      Download HITT on the Deployment Engine by creating a directory and
      fetching hitt.sh from GitHub with curl.
    hide: true
    commands:
      - export REPO_ROOT=$(pwd) && rm -rf /tmp/hitt-download-demo && mkdir -p /tmp/hitt-download-demo && cd /tmp/hitt-download-demo
    show: true

  - comment: "# Download the HITT script (download-hitt)"

  - command: mkdir hitt && cd hitt && curl -skO https://raw.githubusercontent.com/mwaltersbmc/helix-tools/main/hitt/hitt.sh && chmod a+x hitt.sh
    pauseAfter: 1500

  - hide: true
    commands:
      - test -x hitt/hitt.sh || cp $REPO_ROOT/hitt/hitt.sh hitt/hitt.sh; chmod a+x hitt/hitt.sh
    show: true

  - command: ls -la hitt/hitt.sh
    pauseAfter: 500
